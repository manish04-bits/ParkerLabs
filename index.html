<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GAMEVERSE</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<div class="particles"></div>

<header>

    <div class="logo">
        GAME<span>VERSE</span>
    </div>

    <p class="tagline">
        PLAY • COMPETE • DOMINATE
    </p>

</header>


<!-- HOME -->

<section
    id="home"
    class="screen"
>

    <div class="glass">

        <div class="hero-icon">
            🎮
        </div>

        <h1>
            Welcome to GameVerse
        </h1>

        <p>
            Your online mini arcade.
        </p>

        <input
            id="playerName"
            placeholder="Enter your player name"
            maxlength="18"
        >

        <button
            class="main-button"
            onclick="createRoom()"
        >
            CREATE ROOM
        </button>

        <div class="or">
            OR
        </div>

        <input
            id="roomCode"
            placeholder="ENTER ROOM CODE"
            maxlength="6"
        >

        <button
            class="secondary-button"
            onclick="joinRoom()"
        >
            JOIN ROOM
        </button>

        <p
            id="message"
            class="message"
        ></p>

    </div>

</section>


<!-- LOBBY -->

<section
    id="lobby"
    class="screen hidden"
>

    <div class="glass lobby">

        <div class="room-header">

            <div>
                <small>ROOM CODE</small>

                <h1 id="roomDisplay">
                    ------
                </h1>
            </div>

            <button
                class="copy-button"
                onclick="copyRoom()"
            >
                📋 COPY
            </button>

        </div>

        <h2>
            PLAYERS
        </h2>

        <div
            id="players"
            class="players"
        ></div>

        <h2>
            CHOOSE A GAME
        </h2>

        <div class="games">

            <button onclick="chooseGame('ttt')">
                <span>❌⭕</span>
                <b>Tic-Tac-Toe</b>
                <small>Strategy</small>
            </button>

            <button onclick="chooseGame('rps')">
                <span>✊</span>
                <b>Rock Paper Scissors</b>
                <small>Quick Battle</small>
            </button>

            <button onclick="chooseGame('pong')">
                <span>🏓</span>
                <b>Mini Pong</b>
                <small>Arcade</small>
            </button>

            <button onclick="chooseGame('memory')">
                <span>🃏</span>
                <b>Memory Battle</b>
                <small>Memory</small>
            </button>

            <button onclick="chooseGame('snake')">
                <span>🐍</span>
                <b>Snake Battle</b>
                <small>Arcade</small>
            </button>

            <button onclick="chooseGame('racing')">
                <span>🏎️</span>
                <b>Mini Racing</b>
                <small>Racing</small>
            </button>

            <button onclick="chooseGame('arena')">
                <span>🏹</span>
                <b>1v1 Arena</b>
                <small>Battle</small>
            </button>

            <button onclick="chooseGame('quiz')">
                <span>🧠</span>
                <b>Quiz Battle</b>
                <small>Knowledge</small>
            </button>

        </div>

    </div>

</section>


<!-- MODE -->

<section
    id="mode"
    class="screen hidden"
>

    <div class="glass mode-card">

        <div
            id="selectedGameIcon"
            class="big-icon"
        >
            🎮
        </div>

        <h1 id="selectedGameName">
            Game
        </h1>

        <p>
            Choose how you want to play.
        </p>

        <button
            class="main-button"
            onclick="startSinglePlayer()"
        >
            👤 SINGLE PLAYER
        </button>

        <button
            class="secondary-button"
            onclick="startMultiplayer()"
        >
            👥 MULTIPLAYER
        </button>

        <button
            class="back-button"
            onclick="show('lobby')"
        >
            ← BACK
        </button>

    </div>

</section>


<!-- GAME -->

<section
    id="game"
    class="screen hidden"
>

    <div class="glass game-container">

        <div class="game-top">

            <button
                class="back-button"
                onclick="backLobby()"
            >
                ← LOBBY
            </button>

            <div>

                <h1 id="gameTitle">
                    GAME
                </h1>

                <small id="modeLabel">
                    MODE
                </small>

            </div>

        </div>

        <div id="gameArea"></div>

    </div>

</section>


<script src="/socket.io/socket.io.js"></script>

<script src="app.js"></script>

</body>

</html>
