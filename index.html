<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Manish Files 🕷️</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="web web1"></div>
    <div class="web web2"></div>

    <!-- LANDING PAGE -->
    <section id="home" class="screen active">
        <div class="classified">● CLASSIFIED FILE</div>

        <div class="spider">🕷️</div>

        <h1>THE MANISH<br><span>FILES</span></h1>

        <p class="subtitle">How well do you actually know Manish?</p>

        <div class="warning">
            <span>⚠</span>
            <p>7 QUESTIONS • NO CHEATING • NO SECOND CHANCES</p>
        </div>

        <button onclick="startQuiz()" class="main-btn">
            ACCESS THE FILE →
        </button>

        <p class="small">Friend access only • M-001</p>
    </section>


    <!-- QUIZ PAGE -->
    <section id="quiz" class="screen">

        <div class="topbar">
            <span>MANISH FILES</span>
            <span id="questionNumber">01 / 07</span>
        </div>

        <div class="progress-container">
            <div id="progress"></div>
        </div>

        <div class="question-box">

            <div class="question-tag">SUBJECT ANALYSIS</div>

            <h2 id="question"></h2>

            <div id="options"></div>

            <div id="feedback"></div>

            <button id="nextBtn" onclick="nextQuestion()">
                NEXT →
            </button>

        </div>

        <div class="score">
            XP: <span id="score">0</span>
        </div>

    </section>


    <!-- RESULT PAGE -->
    <section id="result" class="screen">

        <div class="classified">● FILE COMPLETE</div>

        <div class="result-icon">🕷️</div>

        <h1 id="resultTitle"></h1>

        <p id="resultMessage"></p>

        <div class="final-score">
            <span id="finalScore">0</span>
            <small>/ 70 XP</small>
        </div>

        <div id="reward"></div>

        <button onclick="restartQuiz()" class="main-btn">
            PLAY AGAIN ↻
        </button>

    </section>


    <script src="script.js"></script>
</body>
</html>
